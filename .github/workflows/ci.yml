name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild weekly: the base image gets security updates even when this repo
  # does not change, and a stale build is the usual source of CVE reports.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      - name: Lint shell scripts
        run: shellcheck tests/run-tests.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: p2rank:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite
        run: tests/run-tests.sh
        env:
          IMAGE: p2rank:local

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: p2rank:scan
          cache-from: type=gha
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: p2rank:scan
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
