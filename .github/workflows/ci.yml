name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild weekly: the base image gets security updates even when this repo
  # does not change, and a stale build is the usual source of CVE reports.
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # v3.1.0 bundles hadolint 2.12, which cannot parse `ADD --checksum`.
      # v3.5.0 bundles 2.15.1, which also no longer needs the DL3006
      # exception the config file used to carry.
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: Lint shell scripts
        run: shellcheck tests/run-tests.sh

  test:
    uses: ./.github/workflows/build-test.yml

  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: p2rank:scan
          cache-from: type=gha
      # Fails only on fixable HIGH/CRITICAL findings, minus the ones recorded
      # in .trivyignore that live inside the upstream P2Rank bundle. So a red
      # build always means something new and actionable appeared.
      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: p2rank:scan
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          exit-code: "1"
