name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything, publish nothing"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  # Published as ghcr.io/<owner>/p2rank, not <owner>/p2rank-docker.
  IMAGE_NAME: ${{ github.repository_owner }}/p2rank

jobs:
  # A tag must not publish an image the behavioural suite has not run against.
  test:
    uses: ./.github/workflows/build-test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      # linux/arm64 is built under emulation, including the in-image smoke
      # prediction. Both platforms together take about five minutes.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile pins the packaged P2Rank release, so it also decides the
      # image tags; the git tag only triggers the build. Upstream versions are
      # not all valid semver ("2.5", "2.6-alpha"), and type=semver silently
      # emits nothing for those, so the tags are set literally.
      - id: ver
        run: echo "v=$(sed -n 's/^ARG P2RANK_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest has exactly one source: the line below. Any prerelease
          # version (one containing "-") leaves it alone.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.ver.outputs.v }}
            type=raw,value=latest,enable=${{ !contains(steps.ver.outputs.v, '-') }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # A dry run exercises the whole path (the version step, the tag
          # computation, the emulated arm64 build and its in-image smoke
          # prediction) without publishing anything irreversible.
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max

      - name: Attest provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
