name: Build and test

# The behavioural suite, factored out so both CI and the release path run the
# same thing. Without this the release path had no test gate at all: ci.yml
# triggers on `push: branches: [main]` and `pull_request`, and a tag push
# matches neither — so tagging published an image the suite had never seen.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # linux/amd64 only: `load: true` cannot load a multi-platform image into
      # the daemon, and the tests drive a running container. arm64 is still
      # covered by the in-Dockerfile smoke prediction at release time.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: p2rank:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run test suite
        run: tests/run-tests.sh
        env:
          IMAGE: p2rank:local
